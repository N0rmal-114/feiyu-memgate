<text x="24.0" y="846.0" class="s">实色点的位置 = 平均字数 × 精确率（按条目数算的正确占比，用来近似字数）。精确率没有定义的系统只画淡色点。</text>
<text x="24.0" y="864.0" class="s">有的系统交付的字数是别的系统的几十倍，线性轴上小的柱子看不清，所以用对数轴和点，不截断任何数值。</text>
